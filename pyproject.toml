[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceki-sdk"
version = "2.36.2"
description = "Python SDK for browser.ceki.me — rent real browsers from real people"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ceki.me", email = "hello@ceki.me"}]
keywords = ["browser", "automation", "websocket", "ai-agent", "ceki"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
]
dependencies = [
    "websockets>=12,<14",
    "httpx>=0.27",
    "pydantic>=2",
    "aiortc>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://ceki.me"
Repository = "https://github.com/Ceki-me/python-sdk"

[project.scripts]
ceki = "ceki_sdk.cli:main"
ceki-daemon = "ceki_sdk.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["ceki_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
