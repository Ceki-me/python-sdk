[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceki-browser"
version = "0.2.0"
description = "Python SDK for browser.ceki.me — rent real browsers of real people"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ceki.me", email = "hello@ceki.me"}]
keywords = ["browser", "automation", "websocket", "rpc", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "websockets>=12.0,<14.0",
    "aiortc>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://browser.ceki.me"
Repository = "https://github.com/Ceki-me/python-sdk"
Documentation = "https://github.com/Ceki-me/python-sdk#readme"

[tool.setuptools.packages.find]
include = ["ceki_browser*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
